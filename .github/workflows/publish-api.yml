# Publica a imagem da API no GitHub Container Registry.
#
# A instância de produção NÃO constrói: `npm ci` + `nest build` numa t3.micro
# (1 GB, vCPU burstável) trava ou leva dez minutos, e um deploy que depende
# disso falha justamente quando há pressa. Aqui a imagem sai pronta e a
# instância só baixa.
#
# Roda depois do CI e só quando ele passa: publicar imagem de um commit que
# não compila é encher o registry de armadilha.

name: Publica a imagem da API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/publish-api.yml"
  # Para republicar sem um commit novo — trocar de instância, por exemplo.
  workflow_dispatch:

concurrency:
  group: publish-api
  cancel-in-progress: false

jobs:
  publish:
    name: Constrói e publica
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Autentica no registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags: `main` para o compose acompanhar sozinho, e o SHA para
      # poder voltar a uma versão específica sem caçar no histórico.
      - name: Calcula as tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/forma-api
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Constrói e publica
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # O cache do Actions evita reconstruir node_modules a cada commit
          # que só toca em `src`.
          cache-from: type=gha
          cache-to: type=gha,mode=max
