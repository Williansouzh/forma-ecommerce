# Publica a imagem da API no GitHub Container Registry.
#
# A instância de produção NÃO constrói: `npm ci` + `nest build` numa t3.micro
# (1 GB, vCPU burstável) trava ou leva dez minutos, e um deploy que depende
# disso falha justamente quando há pressa. Aqui a imagem sai pronta e a
# instância só baixa.
#
# Roda depois do CI e só quando ele passa: publicar imagem de um commit que
# não compila é encher o registry de armadilha. Até aqui o comentário dizia
# isso mas o gatilho era `push` — os dois workflows corriam em paralelo, e a
# tag `main` podia apontar para um commit com o CI vermelho.
#
# Sem filtro de caminho: `workflow_run` não tem `paths`. Um push que não
# toca em `api/` reconstrói a mesma imagem a partir do cache, em segundos.

name: Publica a imagem da API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Para republicar sem um commit novo — trocar de instância, por exemplo.
  # É manual e deliberado, por isso não passa pela trava do CI.
  workflow_dispatch:

concurrency:
  group: publish-api
  cancel-in-progress: false

jobs:
  publish:
    name: Constrói e publica
    # Só CI verde de um push — `workflow_run` também dispara com o CI vermelho
    # ou vindo de pull request, e nenhum dos dois pode virar imagem.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # O commit que o CI APROVOU. Em `workflow_run`, `github.sha` é a ponta
      # da main no momento em que este job roda — outro commit, se alguém
      # empurrou no meio tempo.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Autentica no registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags: `main` para o compose acompanhar sozinho, e o SHA para
      # poder voltar a uma versão específica sem caçar no histórico.
      - name: Calcula as tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/forma-api
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ env.SOURCE_SHA }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Constrói e publica
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # O cache do Actions evita reconstruir node_modules a cada commit
          # que só toca em `src`.
          cache-from: type=gha
          cache-to: type=gha,mode=max
