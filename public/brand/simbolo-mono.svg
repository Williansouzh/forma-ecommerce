<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Camada">
  <!-- Versão de uma cor só, para gravação, carimbo, bordado e fundo colorido.
       A camada viva se distingue pela largura, não pela cor. -->
  <rect x="11" y="5"  width="10" height="5" fill="currentColor"/>
  <rect x="5"  y="11" width="22" height="5" fill="currentColor"/>
  <rect x="7"  y="17" width="18" height="5" fill="currentColor"/>
  <rect x="9"  y="23" width="14" height="5" fill="currentColor"/>
</svg>
