services:
  mongo:
    image: mongo:7
    container_name: forma-mongo
    volumes:
      - forma-mongo-data:/data/db
    # Preso em 127.0.0.1: serve para inspecionar o banco e para gerar o
    # contrato OpenAPI a partir da máquina, sem expor o Mongo na rede.
    ports:
      - "127.0.0.1:27018:27017"
    restart: unless-stopped

  api:
    build: ./api
    image: forma-api
    container_name: forma-api
    environment:
      # Este compose é a pilha de DESENVOLVIMENTO — porta local, dados de
      # demonstração (`SEED_DEMO`) e as credenciais documentadas logo abaixo.
      # Sem dizer isso, a imagem herdaria o `NODE_ENV=production` do
      # Dockerfile e a API se recusaria a iniciar com a senha padrão, que é
      # exatamente o que ela deve fazer num servidor de verdade
      # (`exigeSegredoProprio`, em `api/src/config/configuration.ts`).
      #
      # Quem sobe em produção usa o `docker-compose.prod.yml`, que exige
      # JWT_SECRET e ADMIN_PASSWORD com `:?` e não passa por aqui.
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/forma
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@forma.estudio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-forma-admin-2026}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      SEED_DEMO: ${SEED_DEMO:-true}
      # O Mercado Pago precisa alcançar estas URLs de fora: em produção,
      # aponte para o domínio público, senão o webhook nunca chega.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4001}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3222}
      CORS_ORIGIN: http://localhost:3222,http://localhost:3000,http://localhost:3001
    depends_on:
      - mongo
    ports:
      - "4001:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
        # Domínio de leitura do bucket das imagens. É ARG porque a CSP e o
        # `remotePatterns` do Next são resolvidos no build — mudar só o
        # ambiente e reiniciar não muda nada. Trocou o domínio, refaça o build.
        NEXT_PUBLIC_IMAGE_BASE_URL: ${NEXT_PUBLIC_IMAGE_BASE_URL:-}
    image: forma-ecommerce
    container_name: forma-ecommerce
    environment:
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3222:3000"
    restart: unless-stopped

volumes:
  forma-mongo-data:
